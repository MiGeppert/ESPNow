[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = 
    4-20ma/ModbusMaster @ ^2.0.1

; -------------------------------------------------------------------
; PROFIL 1: ULTRASCHALL-SENSOR
; -------------------------------------------------------------------
[env:zisterne_ultraschall]
build_flags = 
    -D FIRMWARE_VERSION=32
    -D IS_ULTRASCHALL=1

upload_port = /dev/ttyUSB2
monitor_port = /dev/ttyUSB2

; -------------------------------------------------------------------
; PROFIL 2: RADAR-SENSOR
; -------------------------------------------------------------------
[env:zisterne_radar]
build_flags = 
    -D FIRMWARE_VERSION=32
    -D IS_RADAR=1

upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
